apiVersion: apps/v1
kind: Deployment
metadata:
  name: water-monitoring-system
  labels:
    app: water-monitor
spec:
  replicas: 2
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app: water-monitor
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: water-monitor
    spec:
      containers:
      - name: dashboard
        image: YOUR_DOCKERHUB_USERNAME/water-monitor:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 80
        livenessProbe:
          httpGet:
            path: /index.html
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: water-monitoring-service
spec:
  type: NodePort
  selector:
    app: water-monitor
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30080

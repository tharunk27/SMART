apiVersion: apps/v1
kind: Deployment
metadata:
  name: water-monitor
spec:
  replicas: 2
  selector:
    matchLabels:
      app: water-monitor
  template:
    metadata:
      labels:
        app: water-monitor
    spec:
      containers:
      - name: water-monitor-container
        image: YOUR_DOCKERHUB_USERNAME/water-monitor:latest
        ports:
        - containerPort: 80
        readinessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 2
          periodSeconds: 3
---
apiVersion: v1
kind: Service
metadata:
  name: water-monitor-service
spec:
  type: NodePort
  selector:
    app: water-monitor
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30080
